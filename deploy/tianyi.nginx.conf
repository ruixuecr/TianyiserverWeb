proxy_cache_path /var/cache/nginx/tianyi-images levels=1:2
    keys_zone=tianyi_images:16m max_size=1g inactive=7d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    keepalive_timeout 30;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    location ^~ /_next/static/ {
        alias /opt/tianyi/current/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /images/ {
        root /opt/tianyi/current/public;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location = /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache tianyi_images;
        proxy_cache_key "$scheme$proxy_host$request_uri|$http_accept";
        proxy_cache_lock on;
        proxy_cache_valid 200 4h;
        add_header X-Image-Cache $upstream_cache_status;
    }

    # Next.js owns HTML/RSC caching and the map APIs' no-store responses.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
